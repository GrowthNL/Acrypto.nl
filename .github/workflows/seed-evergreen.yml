name: Seed Evergreen Content

# Handmatig te starten (Actions -> Seed Evergreen Content -> Run workflow).
# Voegt de met de hand geschreven evergreen pillar-artikelen toe (idempotent:
# bestaande slugs worden overgeslagen).
on:
  workflow_dispatch:

jobs:
  seed:
    name: Evergreen artikelen toevoegen
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Seed evergreen content
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL niet ingesteld - seed overgeslagen."
            exit 0
          fi
          npm run seed:evergreen
