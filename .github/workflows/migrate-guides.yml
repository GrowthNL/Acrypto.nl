name: Migrate Guides To Kennisbank

# Handmatig te starten (Actions -> Migrate Guides To Kennisbank -> Run workflow).
# Verhuist de evergreen gidsen van /nieuws naar /kennisbank (idempotent).
on:
  workflow_dispatch:

jobs:
  migrate:
    name: Gidsen verhuizen naar kennisbank
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Migrate guides
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL niet ingesteld - migratie overgeslagen."
            exit 0
          fi
          npm run migrate:guides
